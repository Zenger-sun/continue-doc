# Continue-Doc 配置文件

doc:
  # 文档生成规则
  rules: |-
    Use concise language
    Remove off-topic discussions
    Preserve key code snippets
    Use proper Markdown formatting
  
  # 生成文档的输出目录
  output_dir: .continue-doc
  
  # 可选：自定义文档生成的提示词模板
  prompt_template: >-
    Generate a professional technical document from the following AI
    conversation.

    Focus on practical insights and actionable information.

publish:
  # 默认发布平台
  target: zhihu
  
  # 知乎配置
  zhihu:
    cookie: ""
  
  # Medium 配置
  medium:
    api_token: ""
  
  # Dev.to 配置
  devto:
    api_token: ""

# 语言配置
language: zh  # 选项: zh (中文) 或 en (English)
