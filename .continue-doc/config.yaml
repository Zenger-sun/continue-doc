# Continue-Doc 配置文件

doc:
  # 文档生成规则
  rules: |-
    使用简洁的语言
    删除离题讨论  
    保留关键代码片段
    使用正确的 Markdown 格式
  
  # 生成文档的输出目录
  output_dir: .continue-doc
  
  # 可选：自定义文档生成的提示词模板
  prompt_template: >-
    从以下 AI 对话中生成专业的技术文档。
    重点关注实用见解和可操作的信息。

publish:
  # 默认发布平台
  target: zhihu
  
  # 知乎配置
  zhihu:
    cookie: ""
  
  # Medium 配置
  medium:
    api_token: ""
  
  # Dev.to 配置
  devto:
    api_token: ""

# 语言配置
language: zh  # 选项: zh (中文) 或 en (English)
